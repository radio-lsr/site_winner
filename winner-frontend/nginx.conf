map $request_uri $robots_header {
    default "";
    ~*^/(admin|login)(/|$) "noindex, nofollow, noarchive";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.winnermultiservice.com; media-src 'self' blob: https://api.winnermultiservice.com; connect-src 'self' https://api.winnermultiservice.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Grandes médias uniquement pour articles/tutoriels et galerie; les autres API sont plafonnées.
    location ^~ /api/articles {
        client_max_body_size 101m;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location ^~ /api/galerie {
        client_max_body_size 101m;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fichiers uploadés; les types actifs sont refusés côté application et nosniff est forcé.
    location /uploads/ {
        client_max_body_size 1m;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.winnermultiservice.com; media-src 'self' blob: https://api.winnermultiservice.com; connect-src 'self' https://api.winnermultiservice.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
    location /assets/ {
        add_header X-Robots-Tag $robots_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://api.winnermultiservice.com; media-src 'self' blob: https://api.winnermultiservice.com; connect-src 'self' https://api.winnermultiservice.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
