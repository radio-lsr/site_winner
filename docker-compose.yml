# Configuration : copier .env.example vers .env puis définir toutes les valeurs secrètes.
services:
  db:
    image: mysql:8.0
    container_name: winner-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: winner_db
      MYSQL_APP_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD dans .env (hexadécimal)}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./winner-backend/database/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./winner-backend
    container_name: winner-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_USER: winner_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD dans .env}
      DB_NAME: winner_db
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définir ADMIN_EMAIL dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./winner-frontend
      args:
        VITE_API_URL: ""
    container_name: winner-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
